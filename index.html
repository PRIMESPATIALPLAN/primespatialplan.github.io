<style>
/* Layout: a full-screen voyage through the four stages of a project, from the land to a lit home.
   Painted canvas scenes, a portal that previews the next stage and zooms into it, a huge condensed
   title bottom-left and a data panel bottom-right. Deliberately single dark theme. */
:root{
  color-scheme:dark;
  --ink:#F4F1EC; --dim:rgba(244,241,236,.62); --line:rgba(244,241,236,.22); --glass:rgba(20,20,26,.32);
  --brand:#F7991E; --bg:#0B0B0F;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-title:"Oswald","Arial Narrow","Roboto Condensed",Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}

canvas.full{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{transform-origin:50% 60%;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}
#fx{z-index:3;pointer-events:none}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}

.ui{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .8s ease}
.ui.on{opacity:1}
.ui > *{pointer-events:auto}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));pointer-events:none}
.top > *{pointer-events:auto}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark svg{width:26px;height:30px;display:block}
.mark span{font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);
  text-decoration:none;font-size:.8rem;font-weight:500;cursor:pointer;transition:background .2s}
.pill:hover{background:rgba(255,255,255,.22)}
.pill.solid{background:var(--ink);color:#111;border-color:var(--ink)}
.pill.solid:hover{background:#fff}
.lang{display:inline-flex;padding:3px;gap:2px}
.lang button{border:0;background:none;padding:5px 9px;border-radius:999px;font-size:.74rem;font-weight:600;color:var(--dim);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#111}
@media (max-width:640px){.pill.opt{display:none}.mark span{display:none}}

/* stage list */
.stages{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);
  list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stages button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:3px 0;cursor:pointer;
  font-size:.78rem;color:var(--dim);transition:color .2s}
.stages button::before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid currentColor;flex:none;transition:background .2s}
.stages button:hover{color:var(--ink)}
.stages button[aria-current="step"]{color:var(--ink);font-weight:600}
.stages button[aria-current="step"]::before{background:var(--brand);border-color:var(--brand)}

/* portal */
.portal-wrap{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.portal-head{display:flex;justify-content:space-between;width:100%;font-size:.72rem;color:var(--dim);letter-spacing:.04em}
.portal-head b{color:var(--ink);font-weight:600}
.portal{position:relative;width:clamp(150px,17vw,230px);aspect-ratio:.86;border-radius:30px;overflow:hidden;border:0;padding:0;cursor:pointer;
  background:#222;box-shadow:0 30px 60px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.portal:hover{transform:scale(1.04)}
.portal canvas{width:100%;height:100%;display:block}
.enter{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;
  border:0;background:none;cursor:pointer;font-size:.72rem;font-weight:500}
.enter i{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;transition:transform .25s}
.enter i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.enter:hover i{transform:scale(1.12)}
.portal-wrap .gap{height:22px}

/* title */
.title{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:62vw}
.title p{font-size:clamp(.9rem,1.3vw,1.05rem);color:var(--dim);margin:0 0 4px 4px;max-width:46ch}
.title .mdesc{display:none;font-size:.85rem;line-height:1.45;color:var(--ink);opacity:.85;margin-bottom:10px}
.title h1{margin:0;font-family:var(--f-title);font-weight:600;text-transform:uppercase;line-height:.82;letter-spacing:-.01em;
  font-size:clamp(4.2rem,15vw,13.5rem);white-space:nowrap}
.title h1 span{display:inline-block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40%);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}

/* data panel */
.panel{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:min(320px,32vw);
  display:flex;flex-direction:column;font-size:.8rem}
.panel div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding-block:9px;border-top:1px solid var(--line)}
.panel dt{color:var(--dim);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}
.panel dd{margin:0;line-height:1.4}
.panel dl{margin:0}
.panel .cta{margin-top:12px;align-self:flex-start}
@media (max-width:860px){
  .stages{top:auto;bottom:auto;left:0;right:0;transform:none;top:calc(70px + env(safe-area-inset-top,0px));flex-direction:row;justify-content:center;gap:14px}
  .stages button span{display:none}
  .stages button::before{width:8px;height:8px}
  .panel{display:none}
  .title{max-width:none;right:20px}
  .portal-wrap{top:40%}
  .title .mdesc{display:block}
  .stages{gap:10px}
}

/* loader */
.loader{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
.loader.done{opacity:0;pointer-events:none}
.loader svg{width:46px;height:53px}
.loader .pct{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--f-title);font-size:2.2rem;font-weight:500;font-variant-numeric:tabular-nums}
.loader .pct small{font-size:.9rem;margin-left:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){#bg{animation:none}.title h1 span{animation:none}}
</style>
</head>

    var bw=Math.min(H*.5,W*.42), k=bw/400, bx=W*.5, by=hz+H*.12, top=by-230*k;
    function R(x,y,w,h){ return [bx+(x-120)*k, top+(y-100)*k, w*k, h*k]; }
    var wins=[R(160,130,80,62),R(300,130,80,62),R(420,130,60,62),R(300,240,160,90),R(240,252,36,40)];
    ctx.globalCompositeOperation='lighter';
    wins.forEach(function(w){ glow(ctx,w[0]+w[2]/2,by+H*.02,Math.max(w[2],H*.06)*1.4,'rgba(255,160,70,.22)'); });
    ctx.globalCompositeOperation='source-over';
    var body=R(120,100,400,230), par=R(112,88,416,12);
    ctx.fillStyle='#0d1119'; ctx.fillRect(body[0],body[1],body[2],body[3]); ctx.fillRect(par[0],par[1],par[2],par[3]);
    ctx.fillStyle='#dfe7f1'; ctx.fillRect(par[0]-2,par[1]-H*.006,par[2]+4,H*.007);
    wins.forEach(function(w){ var g=ctx.createLinearGradient(0,w[1],0,w[1]+w[3]); g.addColorStop(0,'#ffd79a'); g.addColorStop(1,'#f39633'); ctx.fillStyle=g; ctx.fillRect(w[0],w[1],w[2],w[3]); });
    ctx.strokeStyle='#0d1119'; ctx.lineWidth=Math.max(1,k*2);
    [[200,130,200,192],[340,130,340,192],[340,240,340,330],[380,240,380,330],[420,240,420,330]].forEach(function(l){
      ctx.beginPath(); ctx.moveTo(bx+(l[0]-120)*k,top+(l[1]-100)*k); ctx.lineTo(bx+(l[2]-120)*k,top+(l[3]-100)*k); ctx.stroke(); });
    var door=R(170,245,44,85); ctx.fillStyle='#3a2a1c'; ctx.fillRect(door[0],door[1],door[2],door[3]);
    ctx.globalCompositeOperation='lighter';
    wins.forEach(function(w){ glow(ctx,w[0]+w[2]/2,w[1]+w[3]/2,Math.max(w[2],w[3])*1.1,'rgba(255,170,80,.16)'); });
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(255,180,100,.14)'; ctx.beginPath(); ctx.ellipse(bx+(380-120)*k,by+H*.03,170*k,H*.025,0,0,7); ctx.fill();
    var gx=W*.3, gr=H*.075, gy=by;
    ctx.fillStyle='#c3c9d4'; ctx.beginPath(); ctx.moveTo(gx-gr,gy); ctx.lineTo(gx-gr,gy-gr*.62); ctx.lineTo(gx+gr,gy-gr*.62); ctx.lineTo(gx+gr,gy); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#dfe4ec'; ctx.beginPath(); ctx.moveTo(gx-gr*1.04,gy-gr*.6); ctx.lineTo(gx,gy-gr*1.12); ctx.lineTo(gx+gr*1.04,gy-gr*.6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(60,70,90,.55)'; ctx.lineWidth=1.2; [-.55,0,.55].forEach(function(o){ ctx.beginPath(); ctx.moveTo(gx-gr,gy-gr*(.3+o*.05)); ctx.lineTo(gx+gr,gy-gr*(.3+o*.05)); ctx.stroke(); });
    ctx.fillStyle=OR; ctx.fillRect(gx-gr*.14,gy-gr*.5,gr*.28,gr*.5);
    glow(ctx,gx,gy-gr*.2,gr*.9,'rgba(247,153,30,.18)');
    ctx.strokeStyle='rgba(230,236,245,.12)'; ctx.lineWidth=H*.006; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(gx,gy-gr*1.12); ctx.bezierCurveTo(gx+gr*.3,gy-gr*1.6,gx-gr*.4,gy-gr*1.9,gx+gr*.2,gy-gr*2.4); ctx.stroke();
    for(i=0;i<16;i++){ var t=i/15, px=door[0]+door[2]/2+(W*.08)*t*t, py=by+H*.01+(H-by)*t;
      ctx.fillStyle='rgba(40,50,70,'+(.18-t*.08)+')'; ctx.beginPath(); ctx.ellipse(px+(i%2?H*.008:-H*.008),py,H*(.004+t*.006),H*(.002+t*.004),0,0,7); ctx.fill(); }
    for(i=0;i<260;i++){ ctx.fillStyle='rgba(255,255,255,'+(.25+r()*.5)+')'; ctx.beginPath(); ctx.arc(r()*W,r()*H,r()*1.6+.3,0,7); ctx.fill(); }
  }

  var PAINT=[s01,s02,s03,s04,s05,s06,s07,s08,s09,s10];

  /* ---------- rendering (scenes painted on demand and cached) ---------- */
  var bg=document.getElementById('bg'), fx=document.getElementById('fx'), pv=document.getElementById('pv'),
      scenes=[], cur=0, busy=false, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function dims(){ var d=Math.min(window.devicePixelRatio||1,1.5), w=innerWidth*d, h=innerHeight*d, cap=Math.sqrt(1800000/(w*h));
    if(cap<1){ w*=cap; h*=cap; } return {w:Math.round(w), h:Math.round(h)}; }
  function scene(i){ if(!scenes[i]){ var s=dims(), c=document.createElement('canvas'); c.width=s.w; c.height=s.h; PAINT[i](c.getContext('2d'),s.w,s.h); scenes[i]=c; } return scenes[i]; }
  function blit(canvas,src,cssW,cssH){
    var d=Math.min(window.devicePixelRatio||1,1.5); canvas.width=Math.round(cssW*d); canvas.height=Math.round(cssH*d);
    var ctx=canvas.getContext('2d'), sc=Math.max(canvas.width/src.width,canvas.height/src.height),
        w=src.width*sc, h=src.height*sc; ctx.drawImage(src,(canvas.width-w)/2,(canvas.height-h)*.55,w,h);
  }
  function drawBg(){ blit(bg,scene(cur),innerWidth,innerHeight); }
  function drawPortal(){ var r=pv.getBoundingClientRect(); if(r.width) blit(pv,scene((cur+1)%N),r.width,r.height); }
  function warm(){ var i=0; (function step(){ while(i<N&&scenes[i]) i++; if(i<N){ scene(i); setTimeout(step,60); } })(); }

  /* ---------- UI text ---------- */
  var stagesEl=document.getElementById('stages'), titleEl=document.getElementById('title'), tagEl=document.getElementById('tagline'),
      factsEl=document.getElementById('facts'), nextEl=document.getElementById('nextName'), ctaEl=document.getElementById('cta'),
      mdesc=document.getElementById('mdesc');
  function fitTitle(){
    titleEl.style.fontSize=''; var max=innerWidth>860?innerWidth*.56:innerWidth-40, w=titleEl.scrollWidth;
    if(w>max) titleEl.style.fontSize=(parseFloat(getComputedStyle(titleEl).fontSize)*max/w)+'px';
  }
  function renderText(animate){
    var s=STAGES[cur], n=STAGES[(cur+1)%N];
    stagesEl.innerHTML='';
    STAGES.forEach(function(st,i){
      var li=document.createElement('li'), b=document.createElement('button'); b.type='button';
      var sp=document.createElement('span'); sp.textContent=P.t(st.short); b.appendChild(sp);
      b.setAttribute('aria-label',pad(i+1)+' '+P.t(st.full)); if(i===cur) b.setAttribute('aria-current','step');
      b.onclick=function(){ go(i); }; li.appendChild(b); stagesEl.appendChild(li);
    });
    titleEl.innerHTML=''; var t=document.createElement('span'); t.textContent=P.t(s.short); if(!animate) t.style.animation='none'; titleEl.appendChild(t);
    tagEl.textContent=pad(cur+1)+' — '+P.t(s.full);
    mdesc.textContent=P.t(s.desc);
    nextEl.textContent=pad((cur+1)%N+1)+' '+P.t(n.short);
    factsEl.innerHTML='';
    [[{mn:'Алхам',en:'Step'},{mn:pad(cur+1)+' / '+N,en:pad(cur+1)+' / '+N}],[{mn:'Тайлбар',en:'What we do'},s.desc]].forEach(function(f){
      var d=document.createElement('div'), dt=document.createElement('dt'), dd=document.createElement('dd');
      dt.textContent=P.t(f[0]); dd.textContent=P.t(f[1]); d.appendChild(dt); d.appendChild(dd); factsEl.appendChild(d); });
    ctaEl.hidden=!s.cta;
    fitTitle();
  }

  /* ---------- transition through the portal ---------- */
  function go(target){
    target=(target+N)%N;
    if(busy||target===cur) return;
    var src=scene(target);
    if(reduce){ cur=target; drawBg(); drawPortal(); renderText(false); return; }
    busy=true;
    if(target!==(cur+1)%N) blit(pv,src,pv.getBoundingClientRect().width,pv.getBoundingClientRect().height);
    blit(fx,src,innerWidth,innerHeight); fx.hidden=false;
    var pr=document.getElementById('portal').getBoundingClientRect(), W=innerWidth, H=innerHeight;
    var from='inset('+pr.top+'px '+(W-pr.right)+'px '+(H-pr.bottom)+'px '+pr.left+'px round 30px)';
    var anim=fx.animate([{clipPath:from,filter:'brightness(1.15)'},{clipPath:'inset(0px 0px 0px 0px round 0px)',filter:'brightness(1)'}],
      {duration:1100,easing:'cubic-bezier(.75,0,.2,1)',fill:'forwards'});
    bg.animate([{filter:'brightness(1) blur(0px)'},{filter:'brightness(.5) blur(6px)'}],{duration:1100,easing:'ease-in'});
    if(titleEl.firstChild) titleEl.firstChild.animate([{opacity:1},{opacity:0,transform:'translateY(-20%)',filter:'blur(10px)'}],{duration:500,fill:'forwards'});
    anim.onfinish=function(){ cur=target; drawBg(); fx.hidden=true; anim.cancel(); drawPortal(); renderText(true); busy=false; };
  }
  document.getElementById('portal').onclick=function(){ go(cur+1); };
  document.getElementById('enter').onclick=function(){ go(cur+1); };
  addEventListener('keydown',function(e){ if(e.key==='ArrowRight'||e.key==='ArrowDown') go(cur+1); if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(cur-1); });
  var acc=0, lastWheel=0;
  addEventListener('wheel',function(e){ var now=Date.now(); if(now-lastWheel>500) acc=0; lastWheel=now; acc+=e.deltaY;
    if(Math.abs(acc)>80){ go(acc>0?cur+1:cur-1); acc=0; } },{passive:true});
  var ty0=null; addEventListener('touchstart',function(e){ ty0=e.touches[0].clientY; },{passive:true});
  addEventListener('touchend',function(e){ if(ty0===null) return; var dy=ty0-e.changedTouches[0].clientY; if(Math.abs(dy)>60) go(dy>0?cur+1:cur-1); ty0=null; },{passive:true});
  var rt; addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ scenes=[]; drawBg(); drawPortal(); fitTitle(); warm(); },200); });

  /* ---------- boot: paint the first two scenes while the counter runs ---------- */
  P.on(function(){ renderText(false); });
  drawBg();
  var pct=document.getElementById('pct'), shown=0, start=performance.now(), second=false;
  function count(){
    var t=Math.min(1,(performance.now()-start)/1300); shown=Math.round(100*(1-Math.pow(1-t,3)));
    pct.textContent=shown;
    if(!second&&shown>40){ scene(1); second=true; }
    if(t>=1){
      document.getElementById('loader').classList.add('done');
      document.getElementById('ui').classList.add('on');
      P.init(); renderText(true); drawPortal(); warm();
      if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTitle);
      return;
    }
    requestAnimationFrame(count);
  }
  requestAnimationFrame(count);
})();
</script>
</body>
